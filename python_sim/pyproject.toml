[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "antenna-diversity-sim"
version = "0.1.0"
description = "Dual-antenna GPS L1 C/A RF-to-tracking simulation"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
test = ["pytest>=9.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["antenna_diversity*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
